    <!-- Says what the system does and on what, in the words a researcher would
         search with. The previous version ("converts research questions into
         evidence-backed findings — coordinating literature retrieval,
         hypothesis formulation, ...") described any research tool ever built,
         and it survived here after the same phrasing had already been dropped
         from the page copy for being empty. This is the one line that shows in
         search results, so it is the last place to leave boilerplate. -->
    <meta
      name="description"
      content="Mechanist is an AI scientist that studies AI systems. Give it a question about how a model works inside, and it searches the literature, forms a falsifiable hypothesis, runs the experiments on GPU, and re-tests the result against a different method, dataset, and model. Open source, from ZJUNLP."
    />
    <!-- Fonts are bundled (src/styles/fonts.css), not fetched from
         fonts.googleapis.com. That link was render-blocking and unreachable
         from mainland China, which turned it into a white screen. -->

    <title>Mechanist — an AI scientist for the mechanisms of intelligence</title>
