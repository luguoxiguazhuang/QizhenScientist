<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mechanist Documentation</title>
<!-- One render-blocking stylesheet, linked here rather than imported from
     docs.js, so nothing is ever painted unstyled. The build inlines it and drops
     this link (see vite-plugin-docs.js).
     Inter is bundled through it (docs.css @imports @fontsource-variable/inter),
     not fetched from fonts.googleapis.com: that link was render-blocking and
     unreachable from mainland China, which turned this page white — the same
     reason the main site's index.html bundles its fonts. The *variable*
     package, not the static one: docs.css asks for weights 650/760/850, which
     only a variable axis can hit exactly. -->
<link rel="stylesheet" href="./docs.css">
<script type="module" src="./docs.js"></script>
</head>
<body class="lang-en">

<!-- The hero, the sidebar and the body are filled in at build time from
     docs/content/docs.{en,zh}.md — see vite-plugin-docs.js. Editing the
     docs means editing those two Markdown files and nothing here. The page
     ships as finished HTML so it paints without waiting on JS. -->
<nav class="topbar">
  <a class="brand" href="../" aria-label="Mechanist home">
    <img class="brand-logo" src="../mechanist-logo.png" alt="Mechanist" width="164" height="40">
  </a>
  <div class="top-actions">
    <a class="pill" href="../"><span data-lang="en">Home</span><span data-lang="zh">主页</span></a>
    <a class="pill" href="#installation"><span data-lang="en">Installation</span><span data-lang="zh">安装</span></a>
    <span class="top-divider" aria-hidden="true"></span>
    <a class="pill" href="https://github.com/zjunlp/Mechanist" target="_blank" rel="noreferrer">GitHub</a>
    <span class="lang-switch" role="group" aria-label="Language">
      <button class="lang-button" type="button" data-set-lang="en">EN</button>
      <button class="lang-button" type="button" data-set-lang="zh">中文</button>
    </span>
  </div>
</nav>

<header class="hero">
  <div class="hero-inner" data-slot="hero"><!--docs:hero--></div>
</header>

<div class="shell">
  <aside class="side" aria-label="Documentation navigation" data-slot="sidebar"><!--docs:sidebar--></aside>
  <main data-slot="main"><!--docs:main--></main>
</div>

<footer class="site-docs-footer">
  <div class="site-docs-footer__inner">
    <address class="site-docs-footer__contact">
      <span>Contact</span>
      <a href="mailto:contact@example.com">contact@example.com</a>
      <a href="mailto:contact@example.com">contact@example.com</a>
    </address>
    <div class="site-docs-footer__copy">&copy; 2026 ZJUNLP</div>
  </div>
</footer>

<!-- The other language, parked inert, plus the swap that honours ?lang=zh
     before the first paint. -->
<!--docs:alt-->

</body>
</html>
